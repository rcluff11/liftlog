[package]
name = "liftlog"
version = "0.1.0"
edition = "2024"
default-run = "liftlog"

[dependencies]
axum = "0.8.9"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
dialoguer = "0.12.0"
dirs = "7.0.0"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.54.1", default-features = false, features = ["macros", "rt-multi-thread", "net"] }
